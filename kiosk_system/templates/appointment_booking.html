{%extends 'home.html'%}

{% block title %}Appointment Booking {% endblock title %}



{% block body %}


<div class="container">
    <div style="text-align:center; margin-top:30px;">
        <a href="javascript:history.back()" 
           style="display:inline-block; padding:12px 25px; background:#007bff; color:white; 
                  text-decoration:none; border-radius:8px; font-weight:bold;">
            ⬅ Back
        </a>

        <h1>Book Appointment</h1>
        <h2>{{ provider.username }}</h2>

        <form method="POST">
            {% csrf_token %}

            <!-- New Field: Name -->
            <label>Your Name:</label>
            <input type="text" name="name" required placeholder="Enter your full name">

            <br><br>

            <!-- New Field: Phone Number -->
            <label>Phone Number:</label>
            <input type="tel" name="phone_number" required 
                   pattern="[0-9]{10}" placeholder="Enter 10-digit phone number">

            <br><br>

            <!-- Existing Date Field -->
            <label>Date:</label>
            <input type="date" name="date" required>

            <br><br>

            <!-- Existing Time Field -->
            <label>Time:</label>
            <input type="time" name="time" required>

            <br><br>

            <button type="submit">
                Book Appointment
            </button>
        </form>
    </div>
</div>




{% endblock body %}
